databases:
  - name: tinylink-db
    databaseName: tinylink
    user: tinylink
    plan: free

services:
  # Internal Redis instance
  - type: redis
    name: tinylink-redis
    plan: free
    ipAllowList: []

  # Backend Express API
  - type: web
    name: tinylink-api
    env: docker
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tinylink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tinylink-redis
          property: connectionString
      - key: BASE_URL
        sync: false # Set to your Render API domain: https://tinylink-api.onrender.com
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"

  # Frontend Next.js Web
  - type: web
    name: tinylink-web
    env: docker
    dockerContext: ./web
    dockerfilePath: ./web/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to your Render API domain: https://tinylink-api.onrender.com
